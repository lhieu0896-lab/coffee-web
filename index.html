<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/coffee-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Đặt món cà phê & đồ uống trực tiếp tại bàn hoặc mang về — Quán Nhà Coffee">
  <meta name="theme-color" content="#4A2810">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quán Nhà">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quán Nhà Coffee</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA Install Helper Script -->
  <script>
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });
    window.addEventListener('appinstalled', function() {
      window.pwaDeferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });
    window.triggerPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(function(choice) {
          window.pwaDeferredPrompt = null;
        });
        return true;
      }
      return false;
    };
    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
